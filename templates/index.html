<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Downloader</title>

    <link rel="icon"
        href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="blob blob1"></div>

        <div class="blob blob2"></div>

        <div class="blob blob3"></div>

    </div>

    <!-- Hero -->

    <section class="hero">

        <div class="glass-card">

            <img class="logo"
                src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"
                alt="YouTube">

            <h1>

                YouTube Downloader

            </h1>

            <p class="subtitle">

                Download YouTube videos and audio in seconds.

            </p>

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <!-- Form -->

            <form
                method="POST"
                id="downloadForm">

                <!-- URL -->

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-link"></i>

                    </span>

                    <input
                        class="form-control"
                        type="url"
                        id="url"
                        name="url"
                        placeholder="Paste YouTube URL..."
                        required>

                </div>

                <!-- Format -->

                <div class="format-wrapper">

                    <label class="format-card active">

                        <input
                            type="radio"
                            name="format"
                            value="video"
                            checked>

                        <i class="fa-solid fa-video"></i>

                        <h5>MP4 Video</h5>

                        <p>Best Quality</p>

                    </label>

                    <label class="format-card">

                        <input
                            type="radio"
                            name="format"
                            value="audio">

                        <i class="fa-solid fa-music"></i>

                        <h5>MP3 Audio</h5>

                        <p>High Quality</p>

                    </label>

                </div>

                <!-- Button -->

                <button
                    class="download-btn"
                    type="submit">

                    <i class="fa-solid fa-download"></i>

                    Download Now

                </button>

            </form>

            <!-- Features -->

            <div class="features">

                <div class="feature">

                    <i class="fa-solid fa-bolt"></i>

                    <h6>Fast</h6>

                </div>

                <div class="feature">

                    <i class="fa-solid fa-shield-halved"></i>

                    <h6>Secure</h6>

                </div>

                <div class="feature">

                    <i class="fa-solid fa-film"></i>

                    <h6>HD Video</h6>

                </div>

                <div class="feature">

                    <i class="fa-solid fa-headphones"></i>

                    <h6>320kbps</h6>

                </div>

            </div>

        </div>

    </section>

    <!-- Loading -->

    <div id="loading">

        <div class="spinner-border text-danger"></div>

        <h4>

            Preparing Download...

        </h4>

        <p>

            Please wait...

        </p>

    </div>

    <!-- Footer -->

    <footer>

        <p>

            © <span id="year"></span>

            Made with ❤️ by

            <a
                href="https://github.com/Probal2005"
                target="_blank">

                Probal Dhali

            </a>

        </p>

    </footer>

    <script>

        // Footer Year

        document.getElementById("year").textContent =
            new Date().getFullYear();

        // Active Card

        const cards =
            document.querySelectorAll(".format-card");

        cards.forEach(card => {

            card.addEventListener("click", () => {

                cards.forEach(c => c.classList.remove("active"));

                card.classList.add("active");

            });

        });

        // Loading Screen

        document
            .getElementById("downloadForm")
            .addEventListener("submit", () => {

                document
                    .getElementById("loading")
                    .classList.add("show");

            });

        // Input Glow

        const input =
            document.getElementById("url");

        input.addEventListener("focus", () => {

            input.parentElement.classList.add("focused");

        });

        input.addEventListener("blur", () => {

            input.parentElement.classList.remove("focused");

        });

    </script>

</body>

</html>
